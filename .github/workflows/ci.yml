name: CI

on:
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Verify Python syntax
        run: |
          python -m compileall src/

      - name: Verify test discovery
        run: |
          pytest --collect-only -q

      - name: Run demo test suite
        run: |
          pytest --demo -q --junitxml=reports/reference.xml

      - name: Verify defect detection assertions
        run: |
          expect_test_failure() {
            local status=0
            local report="reports/defect-$1.xml"
            pytest --demo --demo-defect="$1" -q -k "$2" --tb=short --junitxml="$report" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::Defect $1 must produce a test failure (exit 1), got exit $status"
              exit 1
            fi
            python -c 'import sys, xml.etree.ElementTree as ET; cases = list(ET.parse(sys.argv[1]).iter("testcase")); sys.exit(0 if len(cases) == 1 and cases[0].find("failure") is not None and cases[0].find("error") is None else "Expected one assertion failure, not a setup error or skipped test")' "$report"
            echo "Detected expected defect: $1"
          }
          expect_test_failure captcha-bypass "test_tc13_"
          expect_test_failure authentication-bypass "test_tc04_"
          expect_test_failure wrong-message "test_tc04_"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
